# Render Blueprint for the FastAPI + Neon PostgreSQL release.
#
# One web service serves the API and the built React app from the same origin
# (NODE_ENV=production turns on the static mount in api/main.py), so the auth
# cookie and the watchlist WebSocket need no CORS configuration.
#
# PostgreSQL is hosted by Neon and is NOT provisioned by this Blueprint.
# DATABASE_URL uses Neon's pooled endpoint for the app; DIRECT_DATABASE_URL
# uses Neon's direct endpoint for Alembic. Both are entered in the Render
# Dashboard and are never stored in Git.

services:
  - type: web
    name: tradium-fastapi
    runtime: python
    # A paid instance is required for preDeployCommand. The free plan also
    # spins down after 15 idle minutes, which stops the schedulers and drops
    # WebSocket connections.
    plan: 0.5c-512mb
    region: oregon
    # Omit `branch`: Render deploys the branch that contains this file.
    #
    # --include=dev is required because NODE_ENV=production makes `npm ci`
    # skip devDependencies, and Vite is one of them.
    buildCommand: npm ci --include=dev && npm run build && pip install -r api/requirements.txt
    preDeployCommand: alembic upgrade head
    # --forwarded-allow-ips lets Uvicorn trust Render's proxy headers, so the
    # auth rate limiter keys on the real client IP instead of the proxy's.
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'"
    healthCheckPath: /api/health
    # Exactly one instance, so each scheduler and the live feed have a single
    # owner.
    numInstances: 1
    envVars:
      # Prompted once in the Render Dashboard; never stored in Git.
      # DATABASE_URL is Neon's pooled connection string, used by every read and
      # write. DIRECT_DATABASE_URL is the direct (unpooled) string, used only
      # by the pre-deploy `alembic upgrade head`.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      # Render generates a 256-bit value; changing it logs every user out.
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # Explicit, so static serving does not depend on NODE_ENV alone.
      - key: SERVE_STATIC
        value: "true"
      # Optional. Leave it empty to deploy without Nova (the three assistant
      # routes then answer 503).
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      # Live quotes. The provider is unofficial; see
      # docs/LIVE_MARKET_PRICES.md before enabling this publicly.
      - key: LIVE_QUOTES_ENABLED
        value: "true"
      - key: LIVE_QUOTES_FLUSH_SECONDS
        value: "5"
      - key: LIVE_QUOTES_STALE_SECONDS
        value: "60"
      # The Express service is gone, so this single instance owns both job
      # groups: the five-minute market-cache refresh, and the per-minute price
      # sync plus the daily 18:00 IST snapshot. They do different work, so
      # enabling both does not run either one twice.
      - key: MARKET_SYNC_ENABLED
        value: "true"
      - key: TRADING_JOBS_ENABLED
        value: "true"
